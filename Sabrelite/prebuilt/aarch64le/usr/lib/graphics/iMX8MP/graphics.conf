begin khronos
  # adapted from qnx710/target/qnx7/aarch64le/usr/lib/graphics/iMX8MP/graphics.conf

  begin egl display 1
    egl-dlls = libEGL_viv.so
    glesv1-dlls = libGLES_CM_viv.so
    glesv2-dlls = libGLESv2_viv.so
    vg-dlls = libOpenVG_viv.so
    glesv2-sc-dlls = libGLSLC.so
    cl-dlls = libOpenCL.so
    gpu-dlls = libGalcore.so
  end egl display

  begin wfd device 1
   # Choose ONE wfd-dlls line that matches your hardware.

   # i.MX 8MP Nitrogen SMARC board - LVDS 7" or 10" option
   wfd-dlls = libwfdcfg-imx8mp-ezurio.so libWFDimx8m.so

# Display output setting.
# Each display controller can provide output for one display.
# Use these options to enable/disable selected ports.
# Only enabled output ports can be used by the Screen graphic subsystem.
# Possible values for port configuration:
#        enabled  .. port enabled
#        disabled .. port disabled
# NOTE: Use MIPI port to connect IMX-DSI-OLED1 panel.
#
# Setting for WFD port 1 (LCDIF1/MIPI0)
  wfd-port-lcdif1-mipi = enabled
# Setting for WFD port 2 (LCDIF2/LVDS0,LVDS1,DUAL)
  wfd-port-lcdif2-lvds = enabled
# Setting for WFD port 3 (HDMI)
  wfd-port-lcdif3-hdmi = enabled

# The possible port-pipeline bindings are as follows:
#   port      bindable pipelines
# LCDIF1/MIPI       1
# LCDIF2/LVDS       2
# LCDIF3/HDMI       3

# Information about the gpu cores of the iMX8MP chip.
# These values are used by the gpu driver during driver initialization.
  device-base-address = 1073741824
  gpu-physBase        = 1073741824
  gpu-physSize        = 3221225472
  gpu-gpuProfiler     = 0
  gpu-irq-3D          = 35
  gpu-reg-base-3D     = 939524096
  gpu-reg-size-3D     = 32768
  gpu-irq-2D          = 57
  gpu-reg-base-2D     = 939556864
  gpu-reg-size-2D     = 32768
  hasPL310            = 0

# G2D buffer cache settings
  # PTM name for G2D buffer cache allocations.
  # Default is gpu-below4GPoolName or "/memory/below4G".
  # g2d-below4GPoolName = /memory/below4G/ram/sysram

  # Limit on g2d_buf cache pool size in MB.
  # Default is 32.
  # g2d-temp-buffer-limit = 32

  # Size of each g2d_buf buffer to preallocate in MB.
  # Default is empty list.
  # g2d-temp-buffer-sizes = 2 2 2 2 2 2

# GPU driver contiguous memory pool sizes in MB
# Large values have better performance but longer startup time.
# Small values have a variety of performance impacts at run time.
   # gpu-contiguousMB   = 238   # maximum (254 - internalPoolMB)
   gpu-contiguousMB   = 64      # recommended
   # gpu-contiguousMB   = 2     # minimum

# Other memory pools (no need to change these)
   gpu-internalPoolMB = 16
   gpu-sharedPoolMB   = 2

# Report GPU contiguous memory usage statistics (current and minimum
# free space) to slog every N seconds.  A value of 0 disables this feature.
# Also logs when a new minimum level of free space is reached.  Default 0.
  # gpu-slogUsageInterval = 10

# When gpu-slogUsageInterval is enabled, only log new minimum levels
# of free space that are below this amount. Default -1 (always log).
  # gpu-slogLowWatermarkMB = -1

# GPU power management:  If enabled (1), the GPU will control GPU power
# states internal to the GPU core according to GPU load.  Default 0.
# Cannot be enabled when using GPU profiling.
   gpu-powerManagement = 0

# GPU state dump after detection of GPU stall. Possible settings:
# 0 : Dump nothing when the stall is detected.
# 1 : Dump the GPU state, and the memory near stuck point.
# 2 : Besides nearby memory (level 1), dump the context buffer, and the user command buffer.
# 3 : Besides level 2, the commit will stall to make sure the command causing the GPU hang isn't missed.
# 4 : Beside level 2, dump the kernel command buffer. */
# 5 (default) : Dump all the cores with level 4 dump.
   gpu-stuckDump = 5

# Attempt GPU recovery after detection of GPU stall. Possible settings:
# 0 : Do not attempt GPU recovery after detection of GPU stall.
# 1 (default) : Attempt GPU recovery after detection of GPU stall.
   gpu-recovery = 1

# If gpu-recovery is enabled, dump GPU state only once? Possible settings:
# 0 (default) : Dump GPU state, always, when a stall is detected.
# 1 : Dump GPU state only the first time a stall is detected.
   gpu-dumpStateOnlyOnce = 0

# Options to control what debug build of driver writes to slog
   debug-alloc = 0      # Logs memory allocations
   debug-buffer = 0     # Logs first 8 words of each buffer
   debug-cscgamma = 0   # Logs CSC/Gamma correction activity
   debug-dpu = 0        # Logs display controller activity (except pipeline and port)
   debug-isr = 0        # Logs IRQ statistics
   debug-lvds = 0       # Logs LVDS and LDB setup
   debug-mipi = 0       # Logs MIPI  setup
   debug-pipeline = 0   # Logs pipeline activity
   debug-port = 0       # Logs port activity
   debug-register = 0   # Logs register activity to tracelog (not slog!)
   debug-trace = 0      # Logs entry into each WFD function
   debug-misc = 0       # Logs everything else

  end wfd device

end khronos

begin winmgr
  begin globals
    blit-config = gles2blt
    blits-logsize = 4096
  end globals

  begin display 1
    #Mode supported by MIPI panel
    video-mode = 1200 x 1920 @ 60
    defer-framebuffer-creation = false
  end display

  begin display 2
    # Mode supported by Tianma LVDS Display
    video-mode = 1280 x 800 @ 60
    defer-framebuffer-creation = false
  end display

  begin display 3
    # video-mode = 3840 x 2160 @ 30
    video-mode = 1920 x 1080 @ 60
    # video-mode = 1280 x 720 @ 60
    defer-framebuffer-creation = false
  end display


  # For display #1
  begin class framebuffer-1
    display = 1
    pipeline = 1
    format = rgba8888
    usage = gles2blt
  end class

  # For display #2
  begin class framebuffer-2
    display = 2
    pipeline = 2
    format = rgba8888
    usage = gles2blt
  end class

  # For display #3
  begin class framebuffer-3
    display = 3
    pipeline = 3
    format = rgba8888
    usage = vivante
  end class

#  begin mtouch
# Choose ONE of the different mtouch drivers available
#    driver =  egalax
#    driver =  devi
#    driver =  focaltech
#  end mtouch

end winmgr
